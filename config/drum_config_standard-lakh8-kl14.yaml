# ドラム譜MuseMorphose学習設定ファイル（GPU最適化版）

# データ設定
data:
  data_dir: 'data/processed_new/drum_dataset_standard-lakh_with_difficulty'              # トークン化されたドラムデータのディレクトリ
  vocab_path: 'data/metadata_new/drum_vocab_standard-lakh.pkl'          # 語彙ファイルのパス
  tokenization_method: 'standard'         # 'standard' or 'cp_limb_v1'
  train_split: 'data/processed_new/drum_dataset_standard-lakh_with_difficulty/train_split.pkl'  # 訓練データ分割
  val_split: 'data/processed_new/drum_dataset_standard-lakh_with_difficulty/val_split.pkl'      # 検証データ分割
  enc_seqlen: 128                         # エンコーダー最大系列長
  dec_seqlen: 1280                        # デコーダー最大系列長
  max_bars: 16                            # 最大小節数
  batch_size: 8                           # バッチサイズ（GPUメモリに応じて調整）
  num_workers: 4                          # データローダーのワーカー数

# モデル設定
model:
  # エンコーダー
  enc_n_layer: 6                          # エンコーダーのレイヤー数
  enc_n_head: 8                           # エンコーダーのアテンションヘッド数
  enc_d_model: 512                        # エンコーダーのモデル次元
  enc_d_ff: 2048                          # エンコーダーのフィードフォワード次元

  # デコーダー
  dec_n_layer: 6                          # デコーダーのレイヤー数
  dec_n_head: 8                           # デコーダーのアテンションヘッド数
  dec_d_model: 512                        # デコーダーのモデル次元
  dec_d_ff: 2048                          # デコーダーのフィードフォワード次元

  # 潜在空間と埋め込み
  d_latent: 512                           # 潜在空間の次元
  d_embed: 512                            # トークン埋め込みの次元

  # 属性埋め込み（ドラム譜では使用しない）
  d_polyph_emb: 0                         # ポリフォニー埋め込み次元（0=無効）
  d_rfreq_emb: 0                          # リズム頻度埋め込み次元（0=無効）
  use_attr_cls: true                      # 属性クラス条件付けを使用
  use_difficulty: true                   # 難易度ラベルを使用するか
  
  # 難易度埋め込み設定（use_difficulty=trueの場合に有効）
  d_s_tech_emb: 32                        # 技術難易度埋め込み次元
  d_s_indep_emb: 32                       # 独立性難易度埋め込み次元
  d_s_hand_emb: 32                        # 手指難易度埋め込み次元
  d_s_foot_emb: 32                        # 足難易度埋め込み次元
  d_s_move_emb: 32                        # 動き難易度埋め込み次元
  
  # 難易度クラス数設定
  n_s_tech_cls: 8                         # 技術難易度クラス数
  n_s_indep_cls: 8                        # 独立性難易度クラス数
  n_s_hand_cls: 8                         # 手指難易度クラス数
  n_s_foot_cls: 8                         # 足難易度クラス数
  n_s_move_cls: 8                         # 動き難易度クラス数
  
  cond_mode: 'in-attn'                    # 条件付けモード（'in-attn' or 'pre-attn'）
  bar_anchor_mode: 'bar_token'            # 小節潜在アンカー（'first_token' or 'bar_token'）

  # Limb-Relation Bias（四肢相関バイアス）
  use_limb_bias_encoder: true        # EncoderにLimb-Relation Biasを適用するか
  use_limb_bias_decoder: true        # DecoderにLimb-Relation Biasを適用するか
  limb_bias_alpha: 2.0              # Limb-Relation Biasのスケーリング係数（nullの場合は自動計算）

  # Position-Same-Time Bias（同一演奏位置バイアス）
  # 同じ Bar+Beat+Pos にあるノートトークン同士の Attention にバイアスを加算する
  use_position_bias_encoder: false   # Encoder に適用するか
  use_position_bias_decoder: false   # Decoder に適用するか
  # position_bias_mode:
  #   'uniform'    - 全ペアに同一スカラー α
  #   'per_limb'   - HAND/RFOOT/LFOOT の 3×3 対称行列（αSNARE-KICK == αKICK-SNARE）
  #   'asymmetric' - HAND/RFOOT/LFOOT の 3×3 非対称行列（αSNARE→KICK ≠ αKICK→SNARE）
  position_bias_mode: 'uniform'
  position_bias_alpha: null       # Position-Same-Time Biasのスケーリング係数（nullの場合は自動計算）
  position_bias_per_layer: true   # 各層ごとに異なるバイアスを学習するか（falseの場合は全層共通）

  # 階層PE（後方互換のため既定は無効）
  use_hierarchical_pe: false
  hier_pe_bar_vocab_size: 512
  hier_pe_beat_vocab_size: 8
  hier_pe_pos_vocab_size: 32
  hier_pe_use_struct_bias: true

  # CP方式（cp_limb_v1）で利用する損失重み
  cp_loss_weights:
    event_type: 1.0
    structural: 1.0
    cp_pos: 1.0
    cp_hand1: 1.0
    cp_hand2: 1.0
    cp_right_foot: 1.0
    cp_left_foot: 1.0

  d_cp_type_emb: 64
  d_cp_pos_emb: 64
  d_cp_limb_emb: 64

  # 事前学習済みモデル（オプション）
  pretrained_params_path: null            # 事前学習済みパラメータのパス
  pretrained_optim_path: null             # 事前学習済みオプティマイザのパス

# 学習設定
training:
  seed: 42                                # ランダムシード
  device: 'cuda'                          # デバイス ('cuda' or 'cpu')
  use_amp: true                           # Mixed Precision Training（メモリ節約と高速化）
  max_epochs: 100                         # 最大エポック数
  trained_steps: 0                        # 学習済みステップ数（再開用）

  # 学習率
  max_lr: 0.0002                          # 最大学習率
  min_lr: 0.00005                         # 最小学習率
  lr_warmup_steps: 4000                   # ウォームアップステップ数
  lr_decay_steps: 100000                  # 学習率減衰ステップ数

  # KLダイバージェンス
  constant_kl: false                      # 定数KLベータを使用するか
  kl_max_beta: 1.0                        # KLベータの最大値
  no_kl_steps: 1000                       # KLを無効にするステップ数
  kl_cycle_steps: 10000                   # KL周期的スケジューリングの周期
  free_bit_lambda: 0.1                    # Free bitラムダ値

  # チェックポイントとログ
  ckpt_dir: 'trained_model/checkpoints_drum_standard-lakh8-kl14'      # チェックポイントディレクトリ
  ckpt_interval: 20000                      # チェックポイント保存間隔
  log_interval: 500                         # ログ記録間隔
  val_interval: 5000                        # 検証実行間隔
  val_n_rounds: 1                           # 検証時のラウンド数

  # Early Stopping
  early_stopping:
    enabled: true               # true にすると有効化
    patience: 5                 # 改善なしを何検証回分許容するか（val_interval 回分）
    min_delta: 0.00001          # 改善とみなす最小変化量（再構成損失）
    restore_best_weights: true  # 停止時に最良モデルの重みを復元するか